name: Hello World 워크플로우

on:
  push:
    branches: [test-branch] # main 대신 test-branch에서만 실행
  workflow_dispatch: # 수동으로 워크플로우 실행 가능

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Hello World 출력
        run: echo "Hello World! 테스트 워크플로우 실행 중입니다."

      - name: 현재 날짜 출력
        run: echo "현재 시간은 $(date) 입니다."

      - name: 브랜치 정보 출력
        run: echo "현재 실행 중인 브랜치 - ${{ github.ref }}"

      - name: 간단한 스크립트 실행
        run: |
          echo "여러 줄 명령어 실행 예시:"
          echo "1. 디렉토리 목록 확인"
          ls -la
          echo "2. 환경 변수 확인"
          echo $GITHUB_WORKSPACE
